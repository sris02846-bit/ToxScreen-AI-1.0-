apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxscreen-ai
  labels:
    app: toxscreen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: toxscreen
  template:
    metadata:
      labels:
        app: toxscreen
    spec:
      containers:
      - name: toxscreen
        image: toxscreen-ai:latest
        ports:
        - containerPort: 8501
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: toxscreen-service
spec:
  selector:
    app: toxscreen
  ports:
  - name: streamlit
    port: 80
    targetPort: 8501
  - name: api
    port: 8000
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: toxscreen-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: toxscreen-ai
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
